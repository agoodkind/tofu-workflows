name: Publish Terrakube executor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terrakube-executor.yml
      - Dockerfile.terrakube
      - go.mod
      - go.sum
      - cmd/terrakube-configs/**
      - internal/terrakubeexec/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXECUTOR_IMAGE: ghcr.io/agoodkind/tofu-workflows-terrakube-executor
      CONFIGSCTL_COMMIT: e792c43fb63955ce66c88ade6876c61378e52cce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx create --use --driver docker-container
      - name: Publish the executor image
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file Dockerfile.terrakube \
            --build-context "configsctl-source=https://github.com/agoodkind/configsctl.git#$CONFIGSCTL_COMMIT" \
            --tag "$EXECUTOR_IMAGE:$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/executor-build.json" .
      - name: Report the immutable executor reference
        run: |
          jq -er --arg image "$EXECUTOR_IMAGE" --arg sha "$GITHUB_SHA" \
            '"\($image):\($sha)@\(."containerimage.digest")"' \
            "$RUNNER_TEMP/executor-build.json" >> "$GITHUB_STEP_SUMMARY"
