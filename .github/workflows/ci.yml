name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@bc41cecbc2b2d643d24e426a1ca104a4a4e3350a
    permissions:
      contents: read
      id-token: write
      attestations: write
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: tofu-workflows-packaging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: make test GO_TEST_TARGETS='-tags=packaging -run TestActionContainer -count=1 -timeout=25m ./cmd/tofu-workflows'
      - if: always()
        run: docker compose --file compose.yml down --volumes --remove-orphans --rmi local
